<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Admin</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e5ddd5;
}

/* APP CONTAINER */
.app {
  max-width: 420px;
  margin: auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
}

/* HEADER */
.header {
  background: #075e54;
  color: white;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.menu-btn {
  font-size: 20px;
  cursor: pointer;
}

/* SIDEBAR */
#sidebar {
  position: fixed;
  left: -100%;
  top: 0;
  width: 80%;
  height: 100%;
  background: white;
  z-index: 999;
  transition: 0.3s;
  overflow-y: auto;
}

#sidebar.active {
  left: 0;
}

.user-item {
  padding: 15px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

/* CHAT */
#chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  background: #e5ddd5;
}

/* MESSAGES */
.msg {
  max-width: 75%;
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  animation: fade 0.2s ease;
}

.user-msg {
  background: white;
}

.admin-msg {
  background: #dcf8c6;
  margin-left: auto;
}

@keyframes fade {
  from {opacity:0; transform: translateY(10px);}
  to {opacity:1;}
}

/* INPUT */
.input-area {
  display: flex;
  padding: 8px;
  background: #f0f0f0;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
}

button {
  margin-left: 5px;
  padding: 10px 15px;
  border: none;
  background: #075e54;
  color: white;
  border-radius: 20px;
}
</style>
</head>

<body>

<div id="sidebar">
  <h3 style="background:#075e54;color:white;padding:10px;">Users</h3>
  <div id="users-list"></div>
</div>

<div class="app">

  <div class="header">
    <span class="menu-btn" onclick="toggleMenu()">☰</span>
    <span id="header-name">Select Chat</span>
  </div>

  <div id="chat-box"></div>

  <div class="input-area">
    <input id="msg-input" placeholder="Message..." disabled>
    <button id="send-btn" disabled>Send</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  databaseURL: "...",
  projectId: "..."
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let activeUserId = null;

// Sidebar toggle
window.toggleMenu = () => {
  document.getElementById("sidebar").classList.toggle("active");
};

// Load users
onValue(ref(db, 'users_list'), snapshot => {
  const list = document.getElementById('users-list');
  list.innerHTML = "";

  snapshot.forEach(child => {
    const user = child.val();
    const div = document.createElement("div");
    div.className = "user-item";
    div.innerText = user.name;

    div.onclick = () => {
      loadChat(child.key, user.name);
      toggleMenu();
    };

    list.appendChild(div);
  });
});

// Load chat
function loadChat(userId, name){
  activeUserId = userId;
  document.getElementById("header-name").innerText = name;
  document.getElementById("msg-input").disabled = false;
  document.getElementById("send-btn").disabled = false;
  document.getElementById("chat-box").innerHTML = "";

  onChildAdded(ref(db, 'chats/' + userId), snap => {
    const data = snap.val();
    renderMessage(data);
  });
}

// Send message
document.getElementById("send-btn").onclick = () => {
  const input = document.getElementById("msg-input");
  if(!input.value || !activeUserId) return;

  push(ref(db, 'chats/' + activeUserId), {
    sender: "admin",
    text: input.value,
    timestamp: Date.now()
  });

  input.value = "";
};

// Render message
function renderMessage(data){
  const div = document.createElement("div");
  div.className = "msg " + (data.sender === "admin" ? "admin-msg" : "user-msg");
  div.innerText = data.text;

  const box = document.getElementById("chat-box");
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
