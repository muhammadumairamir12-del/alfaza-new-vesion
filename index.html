<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Chat</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #ece5dd;
  display: flex;
  height: 100vh;
}

/* Sidebar */
#sidebar {
  width: 320px;
  background: #fff;
  border-right: 1px solid #ccc;
  overflow-y: auto;
  transition: 0.3s;
}

#sidebar h3 {
  background: #075e54;
  color: white;
  padding: 15px;
  margin: 0;
}

/* Mobile toggle */
.menu-btn {
  display: none;
  padding: 10px;
  background: #075e54;
  color: white;
  cursor: pointer;
}

/* Users */
.user-item {
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  transition: 0.2s;
}
.user-item:hover { background: #f5f5f5; }

/* Chat */
#chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
}

#chat-header {
  background: #075e54;
  color: white;
  padding: 15px;
}

#chat-box {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

/* Messages animation */
.msg {
  margin: 5px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 70%;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(10px);}
  to {opacity:1; transform: translateY(0);}
}

.user-msg {
  background: white;
}

.admin-msg {
  background: #dcf8c6;
  margin-left: auto;
}

/* Input */
.input-area {
  display: flex;
  padding: 10px;
  background: #f0f0f0;
}
input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
}
button {
  padding: 10px 15px;
  background: #075e54;
  color: white;
  border: none;
  border-radius: 20px;
}

/* MOBILE */
@media(max-width: 768px){
  #sidebar {
    position: absolute;
    left: -100%;
    height: 100%;
    z-index: 10;
  }
  #sidebar.active {
    left: 0;
  }
  .menu-btn {
    display: block;
  }
}
</style>
</head>

<body>

<div id="sidebar">
  <h3>Users</h3>
  <div id="users-list"></div>
</div>

<div id="chat-area">
  <div id="chat-header">
    <span class="menu-btn" onclick="toggleMenu()">☰</span>
    <span id="header-name">Select User</span>
  </div>

  <div id="chat-box"></div>

  <div class="input-area">
    <input id="msg-input" placeholder="Type..." disabled>
    <button id="send-btn" disabled>Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  databaseURL: "...",
  projectId: "..."
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let activeUserId = null;

// 🔔 Notification permission
if (Notification.permission !== "granted") {
  Notification.requestPermission();
}

// Sidebar toggle
window.toggleMenu = () => {
  document.getElementById("sidebar").classList.toggle("active");
};

// Load users
onValue(ref(db, 'users_list'), snapshot => {
  const list = document.getElementById('users-list');
  list.innerHTML = "";

  snapshot.forEach(child => {
    const user = child.val();
    const div = document.createElement("div");
    div.className = "user-item";
    div.innerText = user.name;

    div.onclick = () => {
      loadChat(child.key, user.name);
      document.getElementById("sidebar").classList.remove("active");
    };

    list.appendChild(div);
  });
});

// Load chat
function loadChat(userId, name){
  activeUserId = userId;
  document.getElementById("header-name").innerText = name;
  document.getElementById("msg-input").disabled = false;
  document.getElementById("send-btn").disabled = false;
  document.getElementById("chat-box").innerHTML = "";

  onChildAdded(ref(db, 'chats/' + userId), snap => {
    const data = snap.val();
    renderMessage(data);

    // 🔔 Show notification
    if(data.sender === "user"){
      new Notification("New Message", {
        body: data.text
      });
    }
  });
}

// Send message
document.getElementById("send-btn").onclick = () => {
  const input = document.getElementById("msg-input");
  if(!input.value) return;

  push(ref(db, 'chats/' + activeUserId), {
    sender: "admin",
    text: input.value,
    timestamp: Date.now()
  });

  input.value = "";
};

// Render
function renderMessage(data){
  const div = document.createElement("div");
  div.className = "msg " + (data.sender === "admin" ? "admin-msg" : "user-msg");
  div.innerText = data.text;

  const box = document.getElementById("chat-box");
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
</html>
