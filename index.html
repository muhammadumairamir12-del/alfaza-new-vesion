<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e5ddd5;
}

/* FULL APP CONTAINER */
.app {
  max-width: 450px;
  margin: auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
}

/* HEADER */
.header {
  background: #075e54;
  color: white;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.menu-btn {
  font-size: 20px;
  cursor: pointer;
}

/* SIDEBAR (HIDDEN LIKE APP) */
#sidebar {
  position: fixed;
  top: 0;
  left: -100%;
  width: 80%;
  height: 100%;
  background: #fff;
  z-index: 1000;
  transition: 0.3s;
  overflow-y: auto;
}

#sidebar.active {
  left: 0;
}

.user-item {
  padding: 15px;
  border-bottom: 1px solid #eee;
}

/* CHAT */
#chat-box {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  background: #e5ddd5;
}

/* MESSAGE STYLE */
.msg {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  max-width: 75%;
  animation: fade 0.3s;
}

.user-msg { background: white; }
.admin-msg { background: #dcf8c6; margin-left: auto; }

@keyframes fade {
  from {opacity:0; transform: translateY(10px);}
  to {opacity:1;}
}

/* INPUT */
.input-area {
  display: flex;
  padding: 8px;
  background: #f0f0f0;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
}

button {
  margin-left: 5px;
  padding: 10px 15px;
  border: none;
  background: #075e54;
  color: white;
  border-radius: 20px;
}
</style>
</head>

<body>

<div id="sidebar"></div>

<div class="app">

  <div class="header">
    <span class="menu-btn" onclick="toggleMenu()">☰</span>
    <span id="header-name">Chat</span>
  </div>

  <div id="chat-box"></div>

  <div class="input-area">
    <input id="msg-input" placeholder="Message">
    <button onclick="sendMsg()">Send</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  databaseURL: "...",
  projectId: "..."
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let userId = "testUser";

// Sidebar toggle
window.toggleMenu = () => {
  document.getElementById("sidebar").classList.toggle("active");
};

// Send
window.sendMsg = () => {
  const input = document.getElementById("msg-input");
  if(!input.value) return;

  push(ref(db, "chats/" + userId), {
    sender: "admin",
    text: input.value,
    time: Date.now()
  });

  input.value = "";
};

// Receive
onChildAdded(ref(db, "chats/" + userId), snap => {
  const data = snap.val();
  render(data);
});

// Render
function render(data){
  const div = document.createElement("div");
  div.className = "msg " + (data.sender === "admin" ? "admin-msg" : "user-msg");
  div.innerText = data.text;

  const box = document.getElementById("chat-box");
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
